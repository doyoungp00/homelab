---
services:
  frigate:
    container_name: frigate
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    devices:
      - /dev/dri/renderD128 # Intel/AMD GPU for ffmpeg hardware decoding
    image: ghcr.io/blakeblackshear/frigate:stable
    networks:
      - proxy
    ports:
      # - "5000:5000" # Unauthenticated UI/API
      # - "8971:8971" # Authenticated web UI + API
      # - "8554:8554" # RTSP restream (go2rtc)
      - "8555:8555/tcp" # WebRTC over TCP
      - "8555:8555/udp" # WebRTC over UDP
    # privileged: true # Only needed for some hardware setups; try without first
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/frigate/config:/config
      - ${PATH_IPCAM:?PATH_IPCAM not set}:/media/frigate
      - target: /tmp/cache
        tmpfs:
          size: 1000000000
        type: tmpfs
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.frigate.rule=Host(`frigate.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.frigate.tls=true
      - traefik.http.routers.frigate.tls.certresolver=cloudflare
      - traefik.http.routers.frigate.service=frigate
      # Single sign-on: the login wall, then Traefik adds X-Proxy-Secret so
      # Frigate (auth disabled, proxy.auth_secret set) only trusts Authentik's
      # user and group headers when they came through Traefik. Without the
      # secret, anything on `proxy` could send those headers itself.
      - traefik.http.routers.frigate.middlewares=authentik@docker,frigate-proxy-secret@docker
      - "traefik.http.middlewares.frigate-proxy-secret.headers.customrequestheaders.X-Proxy-Secret=${FRIGATE_PROXY_SECRET:?FRIGATE_PROXY_SECRET not set}"
      - traefik.http.services.frigate.loadbalancer.server.port=8971
      # Debug MJPEG endpoint (port 5000, unauthenticated)
      # Gives it a real TLS'd hostname instead of a raw host IP:port, which
      # browsers auto-upgrade/block as mixed content on an HTTPS dashboard.
      # Two routers + two services on one container need explicit .service=
      # labels — otherwise Traefik can't unambiguously pair them and drops one.
      - traefik.http.routers.frigate-stream.rule=Host(`frigate-stream.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.frigate-stream.tls=true
      - traefik.http.routers.frigate-stream.tls.certresolver=cloudflare
      - traefik.http.routers.frigate-stream.service=frigate-stream
      # Port 5000 is the whole unauthenticated UI and API, not just the stream.
      # Homepage's camera card loads it in the browser, which already has the
      # Authentik session from the dashboard, so the wall costs nothing there.
      - traefik.http.routers.frigate-stream.middlewares=authentik@docker
      - traefik.http.services.frigate-stream.loadbalancer.server.port=5000
      # Homepage
      - homepage.group=Surveillance
      - homepage.name=Frigate NVR
      - homepage.icon=frigate.png
      - "homepage.href=https://frigate.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Home surveillance
      - homepage.widget.type=frigate
      # Internal and unauthenticated: Homepage fetches it server-side, so it
      # skips the login wall, and 8971 only answers requests carrying
      # Traefik's proxy secret.
      - "homepage.widget.url=http://frigate:5000"
      # Gatus
      - gatus.enable=true
      - gatus.name=Frigate NVR
      - gatus.group=Infra
      - "gatus.url=http://frigate:5000"
      - gatus.interval=5m
      - 'gatus.conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]'
      - gatus.alert=true

networks:
  proxy:
    external: true

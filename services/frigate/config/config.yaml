---
# Starter config, written to ${MNT_APPDATA}/frigate/config/config.yaml only
# when that file does not yet exist (see hooks.py). After the first deploy
# Frigate and its UI own this file; edits here will NOT be applied, so change
# the live one instead.
# Logins come from Authentik through Traefik (see the README): Frigate's own
# login is off, and it trusts the user and group headers only alongside
# Traefik's X-Proxy-Secret.
auth:
  enabled: false

proxy:
  # Substituted from the container's environment (secret.sops.env).
  auth_secret: "{FRIGATE_PROXY_SECRET}"
  separator: "|"
  header_map:
    user: x-authentik-username
    role: x-authentik-groups
    role_map:
      admin:
        - admins
  default_role: viewer

# Traefik terminates TLS; enabling it here breaks the route.
tls:
  enabled: false

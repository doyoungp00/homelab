---
services:
  navidrome:
    container_name: navidrome
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      - ND_DEFAULTTHEME=Spotify-ish
      # Navidrome's default list with the nd-lyrics plugin appended, so
      # sidecar files and embedded tags still win and the plugin is only
      # consulted when a track has no lyrics of its own. `nd-lyrics` is the
      # plugin's filename without .ndp — see hooks.py, which installs it.
      # Without this entry the plugin loads and is never asked for anything.
      - ND_LYRICSPRIORITY=.ttml,.yaml,.yml,.elrc,.lrc,.srt,.txt,embedded,nd-lyrics
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -fSs http://127.0.0.1:4533 || exit 1
      timeout: 10s
    image: deluan/navidrome:latest
    networks:
      - proxy
    # ports:
    #   - "4533:4533"
    restart: unless-stopped
    user: "568:568"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/navidrome/data:/data
      - ${MNT_MEDIA:?MNT_MEDIA not set}/Music:/music:ro
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.navidrome.rule=Host(`navidrome.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`) || Host(`navidrome.${DOMAIN_PUBLIC:?DOMAIN_PUBLIC not set}`)
      - traefik.http.routers.navidrome.tls=true
      - traefik.http.routers.navidrome.tls.certresolver=cloudflare
      - traefik.http.services.navidrome.loadbalancer.server.port=4533
      # Homepage
      - homepage.group=Media
      - homepage.name=Navidrome
      - homepage.icon=navidrome.png
      - "homepage.href=https://navidrome.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Stream local music
      - homepage.widget.type=navidrome
      - "homepage.widget.url=http://navidrome:4533"
      - homepage.widget.user=${NAVIDROME_HOMEPAGE_USER:?NAVIDROME_HOMEPAGE_USER not set}
      - homepage.widget.token=${NAVIDROME_HOMEPAGE_TOKEN:?NAVIDROME_HOMEPAGE_TOKEN not set}
      - homepage.widget.salt=${NAVIDROME_HOMEPAGE_SALT:?NAVIDROME_HOMEPAGE_SALT not set}
      # Gatus
      - gatus.enable=true
      - gatus.name=Navidrome
      - gatus.group=Media
      - "gatus.url=http://navidrome:4533/ping"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] == 200"]'

networks:
  proxy:
    external: true

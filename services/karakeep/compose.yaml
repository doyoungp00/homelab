---
services:
  chrome:
    command:
      - "--disable-gpu"
      - "--disable-dev-shm-usage"
      - "--hide-scrollbars"
      - "--disable-blink-features=AutomationControlled"
      - "--window-size=1440,900"
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    init: true
    networks:
      - proxy
    restart: unless-stopped

  meilisearch:
    env_file:
      - path: ../shared/env/base.env
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY not set}
      - MEILI_NO_ANALYTICS=true
    image: getmeili/meilisearch:v1.41.0
    networks:
      - proxy
    restart: unless-stopped
    volumes:
      - ${MNT_APPDATA:?MNT_APPDATA not set}/karakeep/meili_data:/meili_data

  web:
    container_name: karakeep
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET not set}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY not set}
      # Karakeep's public address. It builds the OAuth callback from this, so it
      # must match the redirect URI in authentik/blueprints/karakeep.yaml,
      # which is built from the same DOMAIN_LOCAL.
      - NEXTAUTH_URL=https://karakeep.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - MEILI_ADDR=http://meilisearch:7700
      - BROWSER_WEB_URL=http://chrome:9222
      - DATA_DIR=/data
      - CRAWLER_NUM_WORKERS=2
      - CRAWLER_FULL_PAGE_SCREENSHOT=true
      - CRAWLER_STORE_PDF=true
      - CRAWLER_FULL_PAGE_ARCHIVE=true
      - CRAWLER_VIDEO_DOWNLOAD=true
      # Login through Authentik (authentik/blueprints/karakeep.yaml). The id
      # and secret must match the copies in authentik's secret.sops.env.
      - OAUTH_WELLKNOWN_URL=https://auth.${DOMAIN_PUBLIC:?DOMAIN_PUBLIC not set}/application/o/karakeep/.well-known/openid-configuration
      - OAUTH_CLIENT_ID=${KARAKEEP_OIDC_CLIENT_ID:?KARAKEEP_OIDC_CLIENT_ID not set}
      - OAUTH_CLIENT_SECRET=${KARAKEEP_OIDC_CLIENT_SECRET:?KARAKEEP_OIDC_CLIENT_SECRET not set}
      - OAUTH_PROVIDER_NAME=Authentik
      # Links a first OAuth login to the existing account with the same email.
      # Needed because authentik reports email_verified as false; safe because
      # authentik is the only provider and its users are created by an admin.
      - OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING=true
    image: ghcr.io/karakeep-app/karakeep:release
    networks:
      - proxy
    # ports:
    #   - "3000:3000"
    restart: unless-stopped
    volumes:
      - ${MNT_APPDATA:?MNT_APPDATA not set}/karakeep/data:/data
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.karakeep.rule=Host(`karakeep.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.karakeep.tls=true
      - traefik.http.routers.karakeep.tls.certresolver=cloudflare
      - traefik.http.services.karakeep.loadbalancer.server.port=3000
      # Homepage
      - homepage.group=Services
      - homepage.name=Karakeep
      - homepage.icon=karakeep.png
      - "homepage.href=https://karakeep.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Bookmark everything
      - homepage.widget.type=karakeep
      - "homepage.widget.url=http://karakeep:3000"
      - homepage.widget.key=${KARAKEEP_HOMEPAGE_KEY:?KARAKEEP_HOMEPAGE_KEY not set}
      - 'homepage.widget.fields=["bookmarks","archived","highlights"]'
      # Gatus
      - gatus.enable=true
      - gatus.name=Karakeep
      - gatus.group=Services
      - "gatus.url=http://karakeep:3000"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] < 400"]'

networks:
  proxy:
    external: true

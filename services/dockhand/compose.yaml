---
services:
  dockhand:
    container_name: dockhand
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      # Authentik (OIDC) is the only way in. Locked out while Authentik is
      # down: remove this and redeploy, or run Dockhand's emergency script
      # (see the README).
      - DISABLE_LOCAL_LOGIN=true
    image: fnsys/dockhand:latest
    networks:
      - proxy
    # ports:
    #   - "3000:3000"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MNT_APPDATA:?MNT_APPDATA not set}/dockhand/data:/app/data
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.dockhand.rule=Host(`dockhand.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.dockhand.tls=true
      - traefik.http.routers.dockhand.tls.certresolver=cloudflare
      # Both the login wall and Dockhand's own OIDC login: it drives the Docker
      # socket, so the wall keeps even its login page off the network.
      - traefik.http.routers.dockhand.middlewares=authentik@docker
      - traefik.http.services.dockhand.loadbalancer.server.port=3000
      # Homepage
      - homepage.group=Infra
      - homepage.name=Dockhand
      - homepage.icon=dockhand.png
      - "homepage.href=https://dockhand.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Docker containers overview
      - homepage.widget.type=dockhand
      - "homepage.widget.url=http://dockhand:3000"
      # An API token, since local login is off and the widget can't use OIDC.
      # See "Homepage widget" in the README.
      - homepage.widget.key=${DOCKHAND_HOMEPAGE_KEY:-}
      - 'homepage.widget.fields=["stacks","running","events_today"]'
      # Gatus
      - gatus.enable=true
      - gatus.name=Dockhand
      - gatus.group=Infra
      - "gatus.url=http://dockhand:3000"
      - gatus.interval=5m
      - 'gatus.conditions=["[STATUS] == 200"]'

networks:
  proxy:
    external: true

      - gatus.enable=true
      - gatus.name=Sonarr
      - "gatus.group=arr Stack"
      - "gatus.url=http://sonarr:8989"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] < 400", "[RESPONSE_TIME] < 1000"]'

networks:
  proxy:
    external: true

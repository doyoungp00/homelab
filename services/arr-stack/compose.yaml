---
services:
  bazarr:
    container_name: bazarr
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -fSs http://127.0.0.1:6767 || exit 1
      timeout: 10s
    image: lscr.io/linuxserver/bazarr:latest
    networks:
      - proxy
    # ports:
    #   - 6767:6767
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/arr-stack/bazarr-config:/config
      - ${PATH_MOVIES:?PATH_MOVIES not set}:/data/movies
      - ${PATH_TV_SERIES:?PATH_TV_SERIES not set}:/data/tv
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.bazarr.tls=true
      - traefik.http.routers.bazarr.tls.certresolver=cloudflare
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
      # Homepage
      - homepage.group=Downloads
      - homepage.name=Bazarr
      - homepage.icon=bazarr.png
      - "homepage.href=https://bazarr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Fetch and manage subtitles
      - homepage.widget.type=bazarr
      - "homepage.widget.url=http://bazarr:6767"
      - homepage.widget.key=${BAZARR_HOMEPAGE_KEY:-}
      # Gatus
      - gatus.enable=true
      - gatus.name=Bazarr
      - "gatus.group=arr Stack"
      - "gatus.url=http://bazarr:6767"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]'

  cleanuparr:
    container_name: cleanuparr
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      - PORT=11011
      - BASE_PATH=
      # - PUID=1000
      # - PGID=1000
      - UMASK=022
      # - TZ=Etc/UTC
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -fSs http://127.0.0.1:11011/health || exit 1
      timeout: 10s
    image: ghcr.io/cleanuparr/cleanuparr:latest
    networks:
      - proxy
    # ports:
    #   - "11011:11011"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/arr-stack/cleanuparr-config:/config
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.cleanuparr.rule=Host(`cleanuparr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.cleanuparr.tls=true
      - traefik.http.routers.cleanuparr.tls.certresolver=cloudflare
      - traefik.http.services.cleanuparr.loadbalancer.server.port=11011
      # Homepage
      - homepage.group=Downloads
      - homepage.name=Cleanuparr
      - homepage.icon=cleanuparr.png
      - homepage.description=Advanced download manager for the Servarr ecosystem
      - "homepage.href=https://cleanuparr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      # Gatus
      - gatus.enable=true
      - gatus.name=Cleanuparr
      - "gatus.group=arr Stack"
      - "gatus.url=http://cleanuparr:11011/health"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]'

  flaresolverr:
    container_name: flaresolverr
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -fSs http://127.0.0.1:8191 || exit 1
      timeout: 10s
    image: ghcr.io/flaresolverr/flaresolverr:latest
    networks:
      - proxy
    # ports:
    #   - "8191:8191"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.flaresolverr.tls=true
      - traefik.http.routers.flaresolverr.tls.certresolver=cloudflare
      - traefik.http.services.flaresolverr.loadbalancer.server.port=8191
      # Homepage
      - homepage.group=Downloads
      - homepage.name=Flaresolverr
      - homepage.icon=flaresolverr.png
      - homepage.description=Cloudflare protection bypass proxy
      # Gatus
      - gatus.enable=true
      - gatus.name=Flaresolverr
      - "gatus.group=arr Stack"
      - "gatus.url=http://flaresolverr:8191"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]'

  prowlarr:
    container_name: prowlarr
    depends_on:
      gluetun:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -fSs http://127.0.0.1:9696 || exit 1
      timeout: 10s
    image: lscr.io/linuxserver/prowlarr:latest
    # Routed through gluetun's VPN tunnel - shares its network namespace
    # entirely, so no networks:/ports: of its own. Its Traefik/Homepage/Gatus
    # labels live on gluetun below instead, since that's the container that
    # actually has a usable IP for Traefik to discover.
    # Compose resolves this to gluetun's container id at create time, so a
    # recreated gluetun strands this container on a namespace that no longer
    # exists. Don't reach for `depends_on: restart: true`. A restart reuses
    # the same stale id. hooks.py recreates the strays after each deploy.
    network_mode: service:gluetun
    # ports:
    #   - "9696:9696"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/arr-stack/prowlarr-config:/config

  radarr:
    container_name: radarr
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -fSs http://127.0.0.1:7878 || exit 1
      timeout: 10s
    image: lscr.io/linuxserver/radarr:latest
    networks:
      - proxy
    # ports:
    #   - "7878:7878"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/arr-stack/radarr-config:/config
      - ${MNT_TORRENT:?MNT_TORRENT not set}:/downloads # Radarr wants the download paths to match qBittorrent's reported one, e.g. /downloads
      - ${PATH_MOVIES:?PATH_MOVIES not set}:/data/movies
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.radarr.tls=true
      - traefik.http.routers.radarr.tls.certresolver=cloudflare
      - traefik.http.services.radarr.loadbalancer.server.port=7878
      # Homepage
      - homepage.group=Downloads
      - homepage.name=Radarr
      - homepage.icon=radarr.png
      - "homepage.href=https://radarr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Fetch and manage movies
      - homepage.widget.type=radarr
      - "homepage.widget.url=http://radarr:7878"
      - homepage.widget.key=${RADARR_HOMEPAGE_KEY:-}
      # Gatus
      - gatus.enable=true
      - gatus.name=Radarr
      - "gatus.group=arr Stack"
      - "gatus.url=http://radarr:7878"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]'

  seerr:
    container_name: seerr
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      - LOG_LEVEL=info
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:5055/api/v1/settings/public || exit 1
      timeout: 10s
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    networks:
      - proxy
    # ports:
    #   - 5055:5055
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "568:568"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/arr-stack/seerr-config:/app/config
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.seerr.tls=true
      - traefik.http.routers.seerr.tls.certresolver=cloudflare
      - traefik.http.services.seerr.loadbalancer.server.port=5055
      # Homepage
      - homepage.group=Downloads
      - homepage.name=Seerr
      - homepage.icon=seerr.png
      - "homepage.href=https://seerr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Manage media library requests
      - homepage.widget.type=seerr
      - "homepage.widget.url=http://seerr:5055"
      - homepage.widget.key=${SEERR_HOMEPAGE_KEY:-}
      - 'homepage.widget.fields=["pending","completed","issues"]'
      - homepage.widget.highlight.issues.numeric[0].level=warn
      - homepage.widget.highlight.issues.numeric[0].when=gt
      - homepage.widget.highlight.issues.numeric[0].value=0
      # Gatus
      - gatus.enable=true
      - gatus.name=Seerr
      - "gatus.group=arr Stack"
      - "gatus.url=http://seerr:5055/api/v1/status"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]'

  sonarr:
    container_name: sonarr
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -fSs http://127.0.0.1:8989 || exit 1
      timeout: 10s
    image: lscr.io/linuxserver/sonarr:latest
    networks:
      - proxy
    # ports:
    #   - 8989:8989
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/arr-stack/sonarr-config:/config
      - ${MNT_TORRENT:?MNT_TORRENT not set}:/downloads # Sonarr wants the download paths to match qBittorrent's reported one, e.g. /downloads
      - ${PATH_TV_SERIES:?PATH_TV_SERIES not set}:/data/tv
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.routers.sonarr.tls.certresolver=cloudflare
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      # Homepage
      - homepage.group=Downloads
      - homepage.name=Sonarr
      - homepage.icon=sonarr.png
      - "homepage.href=https://sonarr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Fetch and manage TV series
      - homepage.widget.type=sonarr
      - "homepage.widget.url=http://sonarr:8989"
      - homepage.widget.key=${SONARR_HOMEPAGE_KEY:-}
      # Gatus
      - gatus.enable=true
      - gatus.name=Sonarr
      - "gatus.group=arr Stack"
      - "gatus.url=http://sonarr:8989"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]'

  #
  # Gluetun stack
  #
  gluetun:
    cap_add:
      - NET_ADMIN
    container_name: gluetun
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      - VPN_SERVICE_PROVIDER=${GLUETUN_VPN_SERVICE_PROVIDER:?GLUETUN_VPN_SERVICE_PROVIDER not set}
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=${GLUETUN_SERVER_COUNTRIES:?GLUETUN_SERVER_COUNTRIES not set}
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_WIREGUARD_PRIVATE_KEY:?GLUETUN_WIREGUARD_PRIVATE_KEY not set}
      - WIREGUARD_ADDRESSES=10.2.0.2/32
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=${GLUETUN_VPN_PORT_FORWARDING_PROVIDER:?GLUETUN_VPN_PORT_FORWARDING_PROVIDER not set}
      - >-
        VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      - >-
        VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      - UPDATER_PERIOD=24h
    healthcheck:
      interval: 10s
      retries: 10
      test:
        - CMD
        - wget
        - "-q"
        - "--spider"
        - https://1.1.1.1
      timeout: 5s
    image: qmcgaw/gluetun
    networks:
      - proxy
    # ports:
    #   - "8080:8080" # qbittorrent WebUI
    #   - "4567:4567" # suwayomi
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/gluetun:/gluetun
    labels:
      # Prowlarr's Traefik/Gatus - physically on gluetun's labels since
      # prowlarr (network_mode: service:gluetun) has no network identity of
      # its own for Traefik to discover.
      # No homepage.* here either: Homepage only collects a container's status
      # if that same container carries homepage labels, or if services.yaml
      # names it via container:. A card defined by gluetun's labels therefore
      # reports gluetun's health, and a homepage.container=prowlarr label
      # retargets the card onto a status that was never collected — the card
      # then reads NOT FOUND. Prowlarr's card lives in homepage's
      # services.yaml alongside qBittorrent's and Suwayomi's.
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.prowlarr.tls=true
      - traefik.http.routers.prowlarr.tls.certresolver=cloudflare
      - traefik.http.routers.prowlarr.service=prowlarr
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
      - gatus.enable=true
      - gatus.name=Prowlarr
      - "gatus.group=arr Stack"
      - "gatus.url=http://gluetun:9696"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]'
      # qBittorrent Traefik/Gatus
      # Defined on gluetun since it shares its network namespace.
      # No homepage.* here: Homepage's label discovery maps one container to
      # at most one card (an open, unimplemented upstream feature request),
      # so a second card on this same container has to go in services.yaml
      # instead.
      # Gatus is indexed (gatus[1].*) rather than flat, and supports
      # multiple entries per container, unlike Homepage.
      - traefik.http.routers.qbittorrent.rule=Host(`qbit.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.qbittorrent.tls=true
      - traefik.http.routers.qbittorrent.tls.certresolver=cloudflare
      - traefik.http.routers.qbittorrent.service=qbittorrent
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
      - gatus[1].name=qBittorrent
      - gatus[1].group=arr Stack
      - "gatus[1].url=http://gluetun:8080"
      - gatus[1].interval=5m
      - 'gatus[1].conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]'
      # Suwayomi Traefik/Gatus
      - traefik.http.routers.suwayomi.rule=Host(`suwayomi.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.suwayomi.tls=true
      - traefik.http.routers.suwayomi.tls.certresolver=cloudflare
      - traefik.http.routers.suwayomi.service=suwayomi
      - traefik.http.services.suwayomi.loadbalancer.server.port=4567
      - gatus[2].name=Suwayomi
      - gatus[2].group=Media
      - "gatus[2].url=http://gluetun:4567"
      - gatus[2].interval=10m
      - 'gatus[2].conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]'

  qbittorrent:
    container_name: qbittorrent
    depends_on:
      gluetun:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      - WEBUI_PORT=8080
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -fSs http://127.0.0.1:8080 || exit 1
      timeout: 10s
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/qbittorrent:/config
      - ${MNT_TORRENT:?MNT_TORRENT not set}:/downloads

  suwayomi-server:
    container_name: suwayomi-server
    depends_on:
      gluetun:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      - AUTH_MODE=ui_login
      - AUTH_USERNAME=${SUWAYOMI_AUTH_USER:?SUWAYOMI_AUTH_USER not set}
      - AUTH_PASSWORD=${SUWAYOMI_AUTH_PASS:?SUWAYOMI_AUTH_PASS not set}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -fSs http://127.0.0.1:4567 || exit 1
      timeout: 10s
    image: ghcr.io/suwayomi/suwayomi-server:stable
    network_mode: service:gluetun
    restart: unless-stopped
    user: "568:568"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SUWAYOMI_DOWNLOADS:?SUWAYOMI_DOWNLOADS not set}:/home/suwayomi/.local/share/Tachidesk/downloads
      - ${SUWAYOMI_LOCAL:?SUWAYOMI_LOCAL not set}:/home/suwayomi/.local/share/Tachidesk/local
      - ${MNT_APPDATA:?MNT_APPDATA not set}/suwayomi-server/data:/home/suwayomi/.local/share/Tachidesk

networks:
  proxy:
    external: true

---
services:
  ntfy:
    container_name: ntfy
    command:
      - serve
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      - NTFY_BASE_URL=https://ntfy.${DOMAIN_PUBLIC:?DOMAIN_PUBLIC not set}
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_BEHIND_PROXY=true
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
    #   - TZ=UTC
    healthcheck:
      interval: 60s
      retries: 3
      start_period: 40s
      test:
        - CMD-SHELL
        - wget -q --tries=1 http://127.0.0.1:80/v1/health -O - | grep -Eo '"healthy"\s*:\s*true' || exit 1
      timeout: 10s
    image: binwiederhier/ntfy
    init: true # needed, if healthcheck is used. Prevents zombie processes
    networks:
      - proxy
    # ports:
    #   - "80:80"
    restart: unless-stopped
    user: "568:568"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/ntfy:/var/lib/ntfy
      # ntfy supports fully env-only configuration, no need to mount config directory
      # - ${MNT_APPDATA:?MNT_APPDATA not set}/ntfy/etc:/etc/ntfy
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.ntfy.rule=Host(`ntfy.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`) || Host(`ntfy.${DOMAIN_PUBLIC:?DOMAIN_PUBLIC not set}`)
      - traefik.http.routers.ntfy.tls=true
      - traefik.http.routers.ntfy.tls.certresolver=cloudflare
      - traefik.http.services.ntfy.loadbalancer.server.port=80
      # Homepage
      - homepage.group=Infra
      - homepage.name=ntfy
      - homepage.icon=ntfy.png
      - "homepage.href=https://ntfy.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Simple HTTP pub-sub notifications
      # Set up widgets if an overview of a specific topic is required
      - homepage.widget.type=ntfy
      - "homepage.widget.url=http://ntfy"
      - homepage.widget.topic=alerts
      - homepage.widget.key=${NTFY_HOMEPAGE_TOKEN:-}
      # Gatus
      - gatus.enable=true
      - gatus.name=ntfy
      - gatus.group=Infra
      - "gatus.url=http://ntfy/v1/health"
      - gatus.interval=1m
      - 'gatus.conditions=["[STATUS] < 400"]'

networks:
  proxy:
    external: true

---
services:
  homepage:
    container_name: homepage
    env_file:
      - path: .env
        required: false
    environment:
      HOMEPAGE_ALLOWED_HOSTS: dash.${DOMAIN_LOCAL}
      # Homepage substitutes {{HOMEPAGE_VAR_*}} into its YAML configs at parse
      # time. These have to be declared here rather than by mounting an .env
      # file, which is the documented way the substitution silently stops
      # working.
      HOMEPAGE_VAR_DOMAIN_LOCAL: ${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}
      HOMEPAGE_VAR_HOST_IP: ${HOST_IP:?HOST_IP not set}
      HOMEPAGE_VAR_LOCALE: ${HOMEPAGE_LOCALE:-en}
      # The camera's room name and Frigate id. Kept in secret.sops.env so the
      # card itself can stay in git — encrypted and backed up — rather than
      # living only on the NAS.
      HOMEPAGE_VAR_CAM1_NAME: ${HOMEPAGE_CAM1_NAME:?HOMEPAGE_CAM1_NAME not set}
      HOMEPAGE_VAR_CAM1_ID: ${HOMEPAGE_CAM1_ID:?HOMEPAGE_CAM1_ID not set}
      # Optional: the TrueNAS widget just fails to load while this is empty,
      # which is the same as today's placeholder key.
      HOMEPAGE_VAR_TRUENAS_KEY: ${HOMEPAGE_TRUENAS_KEY:-}
      # Moved out of arr-stack with Prowlarr's card. Required rather than
      # defaulted, so relocating the secret can't silently leave a widget
      # that works today showing an error instead.
      HOMEPAGE_VAR_PROWLARR_KEY: ${HOMEPAGE_PROWLARR_KEY:?HOMEPAGE_PROWLARR_KEY not set}
    image: ghcr.io/gethomepage/homepage:latest
    networks:
      - proxy
    # ports:
    #   - "3000:3000"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/homepage/config:/app/config
      - ${MNT_APPDATA:?MNT_APPDATA not set}/homepage/images:/app/public/images
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`dash.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.homepage.tls=true
      - traefik.http.routers.homepage.tls.certresolver=cloudflare
      - traefik.http.services.homepage.loadbalancer.server.port=3000
      # Gatus
      - gatus.enable=true
      - gatus.name=Homepage
      - gatus.group=Infra
      - "gatus.url=http://homepage:3000"
      - "gatus.headers.Host=dash.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - gatus.interval=5m
      - 'gatus.conditions=["[STATUS] == 200"]'

networks:
  proxy:
    external: true

---
services:
  glances:
    container_name: glances
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      - GLANCES_OPT=-C /glances/conf/glances.conf -w --enable-mcp --enable-plugin smart
      - PYTHONPYCACHEPREFIX=/tmp/py_caches
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:61208/api/4/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # See all images tags here: https://hub.docker.com/r/nicolargo/glances/tags
    image: nicolargo/glances:latest-full
    restart: always

    pid: "host"
    network_mode: "host"
    # network_mode: host and `networks:` are mutually exclusive, so this
    # service can't join the shared `proxy` network at all. It's reachable
    # directly via ${HOST_IP}, not a container DNS name. See Traefik label below.

    read_only: true
    privileged: false
    # Uncomment next line for SATA or NVME smartctl monitoring
    cap_add:
      #   Uncomment next line for SATA smartctl monitoring
      - SYS_RAWIO
    #   Uncomment next line for NVME smartctl monitoring
    #   - SYS_ADMIN
    # devices:
    #   - "/dev/nvme0"

    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Uncomment for qemu/libvirt/kvm support with modular libvirt daemons
      # - /var/run/libvirt/virtqemud-sock:/var/run/libvirt/libvirt-sock:ro
      # OR monolithic libvirt daemon
      # - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock:ro
      - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/glances/config/glances.conf:/glances/conf/glances.conf
      # Uncomment for proper distro information in upper panel.
      # Works only for distros that do have this file (most of distros do).
      - /etc/os-release:/etc/os-release:ro

    tmpfs:
      - /tmp

    #     # Uncomment for GPU compatibility (Nvidia) inside the container
    #     deploy:
    #       resources:
    #         reservations:
    #           devices:
    #             - driver: nvidia
    #               count: 1
    #               capabilities: [gpu]

    # Uncomment to protect Glances WebUI by a login/password (add --password to GLANCES_OPT)
    # secrets:
    #   - source: glances_password
    #     target: /root/.config/glances/<login>.pwd

    # secrets:
    #   glances_password:
    #     file: ./secrets/glances_password

    labels:
      # Traefik
      # loadbalancer.server.url support via docker labels (rather than
      # port, which assumes a container on a shared docker network) is
      # inconsistent across Traefik versions
      - traefik.enable=true
      - traefik.http.routers.glances.rule=Host(`glances.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.glances.tls=true
      - traefik.http.routers.glances.tls.certresolver=cloudflare
      - "traefik.http.services.glances.loadbalancer.server.url=http://${HOST_IP:?HOST_IP not set}:61208"
      # Homepage
      - homepage.group=Infra
      - homepage.name=Glances
      - homepage.icon=glances.png
      - "homepage.href=https://glances.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=System monitor
      # Gatus
      - gatus.enable=true
      - gatus.name=Glances
      - gatus.group=Infra
      - "gatus.url=http://${HOST_IP:?HOST_IP not set}:61208/api/4/status"
      - gatus.interval=1m
      - 'gatus.conditions=["[STATUS] == 200"]'

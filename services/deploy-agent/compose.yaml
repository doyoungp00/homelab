---
services:
  deploy-agent:
    build: .
    container_name: deploy-agent
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      - REPO_URL=https://github.com/doyoungp00/homelab.git
      - BRANCH=main
      - POLL_INTERVAL_SECONDS=900
      - SOPS_AGE_KEY_FILE=/run/secrets/age.key
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET not set}
    healthcheck:
      interval: 30s
      retries: 3
      # agent.py only starts listening after its initial reconcile. Usually
      # fast (diff-only), but a genuine first-ever clone force-redeploys
      # every service in the stack, which can take minutes.
      start_period: 180s
      test:
        # GET / serves the deploy GUI (200). Deliberately no -f anyway: this
        # only needs to prove the HTTP server is alive and responding, not
        # that this particular route succeeds.
        - CMD-SHELL
        - curl -sS http://127.0.0.1:9000/ -o /dev/null || exit 1
      timeout: 10s
    networks:
      - proxy
    # ports:
    #   - "9000:9000"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MNT_APPDATA:?MNT_APPDATA not set}/deploy-agent/repo:/repo
      - ${MNT_APPDATA:?MNT_APPDATA not set}/deploy-agent/age.key:/run/secrets/age.key:ro
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.deploy-agent.rule=Host(`deploy-agent.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.deploy-agent.tls=true
      - traefik.http.routers.deploy-agent.tls.certresolver=cloudflare
      - traefik.http.services.deploy-agent.loadbalancer.server.port=9000
      # Homepage
      - homepage.group=Infra
      - homepage.name=Deploy Agent
      - homepage.icon=deployarr.png
      - "homepage.href=https://deploy-agent.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Automated service deployment
      # Gatus
      - gatus.enable=true
      - gatus.name=Deploy Agent
      - gatus.group=Infra
      - "gatus.url=http://deploy-agent:9000"
      - gatus.interval=1m
      - 'gatus.conditions=["[STATUS] < 400"]'

networks:
  proxy:
    external: true

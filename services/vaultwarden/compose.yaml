---
services:
  vaultwarden:
    container_name: vaultwarden
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      DOMAIN: https://vaultwarden.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}
      # SSO through Authentik (authentik/blueprints/vaultwarden.yaml). The id
      # and secret must match the copies in authentik's secret.sops.env. SSO
      # replaces only the login step; the master password still unlocks the
      # vault.
      SSO_ENABLED: "true"
      # Password login stays available as a way back in if Authentik is down.
      SSO_ONLY: "false"
      # The trailing slash matters: it has to equal Authentik's issuer exactly.
      SSO_AUTHORITY: https://auth.${DOMAIN_PUBLIC:?DOMAIN_PUBLIC not set}/application/o/vaultwarden/
      SSO_CLIENT_ID: ${VAULTWARDEN_OIDC_CLIENT_ID:?VAULTWARDEN_OIDC_CLIENT_ID not set}
      SSO_CLIENT_SECRET: ${VAULTWARDEN_OIDC_CLIENT_SECRET:?VAULTWARDEN_OIDC_CLIENT_SECRET not set}
      # Links a first SSO login to the existing account with the same email.
      SSO_SIGNUPS_MATCH_EMAIL: "true"
      # Authentik only for logging in; Vaultwarden keeps its own session
      # lifetime. Authentik's 5-minute access tokens otherwise clash with the
      # clients' own expiry checks.
      SSO_AUTH_ONLY_NOT_SESSION: "true"
    healthcheck:
      interval: 30s
      retries: 3
      test:
        - CMD-SHELL
        - curl -fSs http://127.0.0.1:80 || exit 1
      timeout: 10s
    image: vaultwarden/server:latest
    networks:
      - proxy
    # ports:
    #   - 127.0.0.1:8000:80
    restart: unless-stopped
    user: "568:568"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/vaultwarden/data:/data
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.vaultwarden.tls=true
      - traefik.http.routers.vaultwarden.tls.certresolver=cloudflare
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80
      # Homepage
      - homepage.group=Services
      - homepage.name=Vaultwarden
      - homepage.icon=vaultwarden.png
      - "homepage.href=https://vaultwarden.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Password and secrets manager
      # Gatus
      - gatus.enable=true
      - gatus.name=Vaultwarden
      - gatus.group=Services
      - "gatus.url=http://vaultwarden"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] < 400"]'

networks:
  proxy:
    external: true

# full list of environment variables with descriptions can be found in the documentation:
# https://dawarich.app/docs/self-hosting/environment-variables/
---
services:
  dawarich_app:
    container_name: dawarich_app
    command: ["bin/rails", "server", "-p", "3000", "-b", "::"]
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          cpus: ${APP_CPU_LIMIT:-0.50}
          memory: ${APP_MEMORY_LIMIT:-4G}
    entrypoint: web-entrypoint.sh
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      ### To run under a non-root user, set PUID/PGID here (do NOT use `user:`).
      # PUID: ${PUID:-1000}
      # PGID: ${PGID:-1000}
      APPLICATION_HOSTS: ${APPLICATION_HOSTS:-localhost,::1,127.0.0.1}
      APPLICATION_PROTOCOL: ${APPLICATION_PROTOCOL:-http}
      DATABASE_HOST: ${DATABASE_HOST:-dawarich_db}
      DATABASE_NAME: ${DATABASE_NAME:-dawarich_development}
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD:?DAWARICH_DB_PASSWORD not set}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      ### OTP encryption keys are required if you want to use 2FA
      # OTP_ENCRYPTION_PRIMARY_KEY: ${OTP_ENCRYPTION_PRIMARY_KEY:-}
      # OTP_ENCRYPTION_DETERMINISTIC_KEY: ${OTP_ENCRYPTION_DETERMINISTIC_KEY:-}
      # OTP_ENCRYPTION_KEY_DERIVATION_SALT: ${OTP_ENCRYPTION_KEY_DERIVATION_SALT:-}
      PROMETHEUS_EXPORTER_ENABLED: ${PROMETHEUS_EXPORTER_ENABLED:-false}
      RAILS_ENV: ${RAILS_ENV:-production}
      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-true}
      REDIS_URL: ${REDIS_URL:-redis://dawarich_redis:6379}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE not set}
      SELF_HOSTED: ${SELF_HOSTED:-true}
      STORE_GEODATA: ${STORE_GEODATA:-true}
      TIME_ZONE: ${TZ:-UTC}
      # One preloaded Puma worker is plenty for a household instance and
      # halves idle memory. Raise for busier instances.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    healthcheck:
      interval: 10s
      retries: 30
      start_period: 30s
      test:
        - CMD-SHELL
        - wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '"status"\s*:\s*"ok"'
      timeout: 10s
    image: freikin/dawarich:latest
    logging:
      driver: json-file
      options:
        max-file: ${LOG_MAX_FILE:-5}
        max-size: ${LOG_MAX_SIZE:-100m}
    networks:
      - dawarich
      - proxy
    # ports:
    #   - 8087:3000
    #   - ${DAWARICH_APP_PORT:-3000}:3000
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ${MNT_APPDATA:?MNT_APPDATA not set}/dawarich/public:/var/app/public
      - ${MNT_APPDATA:?MNT_APPDATA not set}/dawarich/watched:/var/app/tmp/imports/watched
      - ${MNT_APPDATA:?MNT_APPDATA not set}/dawarich/storage:/var/app/storage
      - ${MNT_APPDATA:?MNT_APPDATA not set}/dawarich/db_data:/dawarich_db_data
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.dawarich.rule=Host(`dawarich.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`)
      - traefik.http.routers.dawarich.tls=true
      - traefik.http.routers.dawarich.tls.certresolver=cloudflare
      - traefik.http.services.dawarich.loadbalancer.server.port=3000
      # Homepage
      - homepage.group=Services
      - homepage.name=Dawarich
      - homepage.icon=dawarich.png
      - "homepage.href=https://dawarich.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Location history and journal
      # Gatus
      - gatus.enable=true
      - gatus.name=Dawarich
      - gatus.group=Services
      - "gatus.url=http://dawarich_app:3000/api/v1/health"
      - gatus.interval=1m
      - 'gatus.conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]'

  dawarich_db:
    container_name: dawarich_db
    # command: postgres -c config_file=/etc/postgresql/postgresql.conf # Use custom config, uncomment if you want to use a custom config
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dawarich_development}
      POSTGRES_PASSWORD: ${DAWARICH_DB_PASSWORD:?DAWARICH_DB_PASSWORD not set}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dawarich_development}
      timeout: 10s
    image: postgis/postgis:17-3.5-alpine
    # image: imresamu/postgis:17-3.5-alpine # If you're on ARM architecture, use this image instead
    networks:
      - dawarich
    restart: always
    shm_size: 1G
    volumes:
      - ${MNT_APPDATA:?MNT_APPDATA not set}/dawarich/db_data:/var/lib/postgresql/data
      - ${MNT_APPDATA:?MNT_APPDATA not set}/dawarich/shared:/var/shared

  dawarich_redis:
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --appendonly no
    container_name: dawarich_redis
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      timeout: 10s
    image: redis:7.4-alpine
    networks:
      - dawarich
    restart: always
    volumes:
      - ${MNT_APPDATA:?MNT_APPDATA not set}/dawarich/shared:/data

  dawarich_sidekiq:
    command: ["sidekiq"]
    container_name: dawarich_sidekiq
    depends_on:
      dawarich_app:
        condition: service_healthy
        restart: true
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true
    entrypoint: sidekiq-entrypoint.sh
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    environment:
      ### To run under a non-root user, set PUID/PGID here (do NOT use `user:`).
      # PUID: ${PUID:-1000}
      # PGID: ${PGID:-1000}
      APPLICATION_HOSTS: ${APPLICATION_HOSTS:-localhost,::1,127.0.0.1}
      APPLICATION_PROTOCOL: ${APPLICATION_PROTOCOL:-http}
      # 3 job threads keep idle memory and DB connections low; raise
      # temporarily for large imports.
      BACKGROUND_PROCESSING_CONCURRENCY: ${BACKGROUND_PROCESSING_CONCURRENCY:-3}
      DATABASE_HOST: ${DATABASE_HOST:-dawarich_db}
      DATABASE_NAME: ${DATABASE_NAME:-dawarich_development}
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD:?DAWARICH_DB_PASSWORD not set}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      ### OTP encryption keys are required if you want to use 2FA
      # OTP_ENCRYPTION_PRIMARY_KEY: ${OTP_ENCRYPTION_PRIMARY_KEY:-}
      # OTP_ENCRYPTION_DETERMINISTIC_KEY: ${OTP_ENCRYPTION_DETERMINISTIC_KEY:-}
      # OTP_ENCRYPTION_KEY_DERIVATION_SALT: ${OTP_ENCRYPTION_KEY_DERIVATION_SALT:-}
      PROMETHEUS_EXPORTER_ENABLED: ${PROMETHEUS_EXPORTER_ENABLED:-false}
      RAILS_ENV: ${RAILS_ENV:-production}
      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-true}
      REDIS_URL: ${REDIS_URL:-redis://dawarich_redis:6379}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE not set}
      SELF_HOSTED: ${SELF_HOSTED:-true}
      STORE_GEODATA: ${STORE_GEODATA:-true}
    healthcheck:
      interval: 10s
      retries: 30
      start_period: 30s
      test: ["CMD-SHELL", "pgrep -f sidekiq"]
      timeout: 10s
    image: freikin/dawarich:latest
    logging:
      driver: json-file
      options:
        max-file: ${LOG_MAX_FILE:-5}
        max-size: ${LOG_MAX_SIZE:-100m}
    networks:
      - dawarich
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ${MNT_APPDATA:?MNT_APPDATA not set}/dawarich/public:/var/app/public
      - ${MNT_APPDATA:?MNT_APPDATA not set}/dawarich/watched:/var/app/tmp/imports/watched
      - ${MNT_APPDATA:?MNT_APPDATA not set}/dawarich/storage:/var/app/storage

networks:
  dawarich: null
  proxy:
    external: true

---
services:
  jellyfin:
    container_name: jellyfin
    devices:
      - /dev/dri:/dev/dri
    env_file:
      - path: .env
        required: false
      - path: ../shared/env/base.env
    # Optional - alternative address used for autodiscovery
    environment:
      - "JELLYFIN_PublishedServerUrl=https://jellyfin.${DOMAIN_PUBLIC:?DOMAIN_PUBLIC not set}"
    image: jellyfin/jellyfin
    networks:
      - proxy
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      # - type: bind
      #   source: /path/to/fonts
      #   target: /usr/local/share/fonts/custom
      #   read_only: true
    restart: unless-stopped
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    user: "568:568"
    group_add:
      - "107" # render (renderD128)
      - "44" # video (card0)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MNT_APPDATA:?MNT_APPDATA not set}/jellyfin/config:/config
      - ${MNT_APPDATA:?MNT_APPDATA not set}/jellyfin/cache:/cache
      - ${MNT_MEDIA:?MNT_MEDIA not set}/Movies:/movies
      - ${MNT_MEDIA:?MNT_MEDIA not set}/TV Series:/tv_series
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    # extra_hosts:
    #   - 'host.docker.internal:host-gateway'
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}`) || Host(`jellyfin.${DOMAIN_PUBLIC:?DOMAIN_PUBLIC not set}`)
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.routers.jellyfin.tls.certresolver=cloudflare
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      # Homepage
      - homepage.group=Media
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin.png
      - "homepage.href=https://jellyfin.${DOMAIN_LOCAL:?DOMAIN_LOCAL not set}"
      - homepage.description=Watch movies & TV
      - homepage.widget.type=jellyfin
      - "homepage.widget.url=http://jellyfin:8096"
      - homepage.widget.key=${JELLYFIN_HOMEPAGE_KEY:?JELLYFIN_HOMEPAGE_KEY not set}
      - homepage.widget.version=2
      - homepage.widget.enableBlocks=true
      - homepage.widget.enableNowPlaying=false
      - 'homepage.widget.fields=["movies","series","episodes"]'
      # Gatus
      - gatus.enable=true
      - gatus.name=Jellyfin
      - gatus.group=Media
      - "gatus.url=http://jellyfin:8096/health"
      - gatus.interval=10m
      - 'gatus.conditions=["[STATUS] == 200"]'

networks:
  proxy:
    external: true

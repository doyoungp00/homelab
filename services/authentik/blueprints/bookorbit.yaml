# OIDC login for BookOrbit. BookOrbit's side (issuer, client id/secret,
# provisioning) lives in its database and is set in its UI; see its README.
# The client id and secret come from secret.sops.env so both sides share one
# value.
#
# BookOrbit matches by username, not email, and only when "local linking" is
# on in its provider settings. It's left off: existing accounts are linked
# from their own account settings while logged in.
version: 1
metadata:
  name: homelab - bookorbit
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: homelab/groups.yaml
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Provider for BookOrbit
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Must be listed: the field defaults to empty, and a provider created by
      # a blueprint (unlike the UI form) gets no defaults, so authentik rejects
      # every login with invalid_request before showing a page.
      grant_types: [authorization_code, refresh_token]
      client_id: !Env BOOKORBIT_OIDC_CLIENT_ID
      client_secret: !Env BOOKORBIT_OIDC_CLIENT_SECRET
      redirect_uris:
        # Web client, built from BookOrbit's APP_URL.
        - matching_mode: strict
          url: !Format ["https://bookorbit.%s/oauth2-callback", !Env DOMAIN_LOCAL]
        # The Android app (NATIVE_REDIRECT_URI's default).
        - matching_mode: strict
          url: bookorbit://oauth2-callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: bookorbit
    attrs:
      name: BookOrbit
      provider: !KeyOf provider
      meta_launch_url: !Format ["https://bookorbit.%s", !Env DOMAIN_LOCAL]

  # Everyone: admins and family. Bindings are OR'd (policy engine mode "any").
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, family]]
    attrs:
      order: 1

# OIDC login for Dawarich. Dawarich's side is environment variables in its own
# compose.yaml; the client id and secret are in both services'
# secret.sops.env and must hold the same values.
#
# Dawarich never links by email on its own: a first OIDC login whose email
# matches an existing account asks for that account's Dawarich password, then
# links it. It also refuses unverified emails, hence the verified mapping.
version: 1
metadata:
  name: homelab - dawarich
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: homelab/groups.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: homelab/scope-mappings.yaml
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Provider for Dawarich
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Must be listed: the field defaults to empty, and a provider created by
      # a blueprint (unlike the UI form) gets no defaults, so authentik rejects
      # every login with invalid_request before showing a page.
      grant_types: [authorization_code, refresh_token]
      client_id: !Env DAWARICH_OIDC_CLIENT_ID
      client_secret: !Env DAWARICH_OIDC_CLIENT_SECRET
      redirect_uris:
        # Set explicitly in Dawarich as OIDC_REDIRECT_URI.
        - matching_mode: strict
          url: !Format ["https://dawarich.%s/users/auth/openid_connect/callback", !Env DOMAIN_LOCAL]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        # Dawarich refuses any login whose email_verified is false.
        - !Find [authentik_providers_oauth2.scopemapping, [name, "homelab: OpenID 'email' (verified)"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: dawarich
    attrs:
      name: Dawarich
      provider: !KeyOf provider
      meta_launch_url: !Format ["https://dawarich.%s", !Env DOMAIN_LOCAL]

  # Everyone: admins and family. Bindings are OR'd (policy engine mode "any").
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, family]]
    attrs:
      order: 1

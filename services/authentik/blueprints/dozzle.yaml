# OIDC login for Dozzle. Dozzle's side is environment variables in its own
# compose.yaml; the client id and secret are in both services'
# secret.sops.env and must hold the same values.
#
# OIDC rather than Dozzle's forward-proxy mode: that trusts a username header
# from anything that can reach the container, i.e. every container on
# `proxy`, and Dozzle has shell access to every container. Here Dozzle checks
# Authentik's token itself, and reads its permissions from a dozzle_roles
# claim; a login without that claim is refused.
version: 1
metadata:
  name: homelab - dozzle
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: homelab/groups.yaml
      required: true

  # Requested by Dozzle as an extra scope (DOZZLE_AUTH_OIDC_SCOPES). `all`
  # grants shell, actions, and downloads. Empty for anyone else, which Dozzle
  # refuses, though only admins can reach this application anyway.
  - model: authentik_providers_oauth2.scopemapping
    id: roles
    identifiers:
      name: "homelab: Dozzle roles"
    attrs:
      scope_name: dozzle
      description: Dozzle roles
      expression: |
        if ak_is_group_member(request.user, name="admins"):
            return {"dozzle_roles": ["all"]}
        return {}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Provider for Dozzle
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Must be listed: the field defaults to empty, and a provider created by
      # a blueprint (unlike the UI form) gets no defaults, so authentik rejects
      # every login with invalid_request before showing a page.
      grant_types: [authorization_code, refresh_token]
      client_id: !Env DOZZLE_OIDC_CLIENT_ID
      client_secret: !Env DOZZLE_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://dozzle.%s/api/auth/callback", !Env DOMAIN_LOCAL]
        # Where Dozzle's logout returns to, after signing out of Authentik too.
        - matching_mode: strict
          url: !Format ["https://dozzle.%s/login", !Env DOMAIN_LOCAL]
          redirect_uri_type: logout
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf roles

  - model: authentik_core.application
    id: application
    identifiers:
      slug: dozzle
    attrs:
      name: Dozzle
      provider: !KeyOf provider
      meta_launch_url: !Format ["https://dozzle.%s", !Env DOMAIN_LOCAL]

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0

# SSO login for Vaultwarden. Vaultwarden's side is environment variables in
# its own compose.yaml; the client id and secret are in both services'
# secret.sops.env and must hold the same values.
#
# SSO replaces only the login step: the master password still decrypts the
# vault. Vaultwarden links a first SSO login to the existing account with the
# same email, but only if email_verified is true, hence the verified mapping.
# After that it matches by issuer and subject, not email.
version: 1
metadata:
  name: homelab - vaultwarden
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: homelab/groups.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: homelab/scope-mappings.yaml
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Provider for Vaultwarden
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Must be listed: the field defaults to empty, and a provider created by
      # a blueprint (unlike the UI form) gets no defaults, so authentik rejects
      # every login with invalid_request before showing a page.
      grant_types: [authorization_code, refresh_token]
      client_id: !Env VAULTWARDEN_OIDC_CLIENT_ID
      client_secret: !Env VAULTWARDEN_OIDC_CLIENT_SECRET
      redirect_uris:
        # Built by Vaultwarden from its DOMAIN.
        - matching_mode: strict
          url: !Format ["https://vaultwarden.%s/identity/connect/oidc-signin", !Env DOMAIN_LOCAL]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        # Vaultwarden won't link an existing account unless email_verified is true.
        - !Find [authentik_providers_oauth2.scopemapping, [name, "homelab: OpenID 'email' (verified)"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: vaultwarden
    attrs:
      name: Vaultwarden
      provider: !KeyOf provider
      meta_launch_url: !Format ["https://vaultwarden.%s", !Env DOMAIN_LOCAL]

  # Everyone: admins and family. Bindings are OR'd (policy engine mode "any").
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, family]]
    attrs:
      order: 1

# OIDC login for Immich. Immich's side (issuer, client id/secret, auto
# register) lives in its database and is set under Administration > Settings
# > Authentication Settings > OAuth; the client id and secret come from
# secret.sops.env so both sides share one value.
#
# Immich links a first OAuth login to the existing account with the same
# email, so a user's Authentik email must match their Immich one. No role
# claim is sent: Immich only rewrites isAdmin when one is present, so existing
# roles stay as they are.
version: 1
metadata:
  name: homelab - immich
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: homelab/groups.yaml
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Provider for Immich
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Must be listed: the field defaults to empty, and a provider created by
      # a blueprint (unlike the UI form) gets no defaults, so authentik rejects
      # every login with invalid_request before showing a page.
      grant_types: [authorization_code, refresh_token]
      client_id: !Env IMMICH_OIDC_CLIENT_ID
      client_secret: !Env IMMICH_OIDC_CLIENT_SECRET
      redirect_uris:
        # Web login, and manual linking from account settings.
        - matching_mode: strict
          url: !Format ["https://immich.%s/auth/login", !Env DOMAIN_LOCAL]
        - matching_mode: strict
          url: !Format ["https://immich.%s/user-settings", !Env DOMAIN_LOCAL]
        # The iOS and Android apps.
        - matching_mode: strict
          url: app.immich:///oauth-callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: immich
    attrs:
      name: Immich
      provider: !KeyOf provider
      meta_launch_url: !Format ["https://immich.%s", !Env DOMAIN_LOCAL]

  # Everyone: admins and family. Bindings are OR'd (policy engine mode "any").
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, family]]
    attrs:
      order: 1
